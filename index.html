    <!-- SPA redirect decoder for GitHub Pages (works with 404.html).
         Restores the original clean URL that 404.html encoded into ?/path
         before the React app mounts. Technique: rafgraph/spa-github-pages -->
    <script>
      (function () {
        var l = window.location;
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })();
    </script>
